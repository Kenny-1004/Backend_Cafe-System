# Render Blueprint: Dashboard → New → Blueprint → pick this repo.
# Creates the free Postgres database and the API. After the first deploy, run the migrations
# and switch DATABASE_URL to the restricted cafe_api login (see README: Database roles).
databases:
  - name: cafe-db
    databaseName: cafe
    user: cafe_owner
    plan: free
    region: singapore
    postgresMajorVersion: "16"

services:
  - type: web
    name: cafe-system-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: PUBLIC_KIOSK
        value: "true" # customers order from /kiosk on their own phones
      - key: TRUST_PROXY
        value: "2" # browser → Vercel → Render's load balancer → API
      - key: DATABASE_URL
        fromDatabase:
          name: cafe-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
