# Render Blueprint: Dashboard → New → Blueprint → pick this repo.
# The database is external (see DEPLOY.md); secrets marked sync: false are entered in the dashboard.
services:
  - type: web
    name: cafe-system-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: TRUST_PROXY
        value: "2" # browser → Vercel → Render's load balancer → API
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
